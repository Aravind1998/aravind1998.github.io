<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Aravind Suresh</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%236366f1%22/><text y=%22.68em%22 x=%2250%25%22 font-size=%2252%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>AS</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/custom-theme.css">
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .code-404 {
      font-size: clamp(6rem, 15vw, 10rem);
      font-family: var(--font-mono);
      font-weight: 800;
      line-height: 1;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
  </div>

  <div class="not-found-wrapper">
    <div class="code-404">404</div>
    <h1 style="font-size: 2rem; margin-bottom: 16px;">Lost in Cyberspace</h1>
    <p style="max-width: 500px; margin-bottom: 30px; font-size: 1.1rem; color: var(--text-secondary);">
      The page you're searching for doesn't exist, has been moved, or has ventured into a black hole.
    </p>
    <a href="/" class="btn btn-primary">
      <i class="fa-solid fa-house"></i>
      <span>Return to Safety</span>
    </a>
  </div>

  <script>
    const savedTheme = localStorage.getItem('as-portfolio-theme') || 'midnight';
    if (savedTheme !== 'midnight') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  </script>
</body>
</html>
